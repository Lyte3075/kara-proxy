<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        // Set the tab icon before the browser finishes parsing the document.
        // Safari often ignores favicon changes made later by a client-side app.
        let href = "/Kara.png";
        try {
          const saved = JSON.parse(localStorage.getItem("kara.settings") || "null");
          if (saved && saved.tabCloakEnabled && typeof saved.tabCloakFavicon === "string" && saved.tabCloakFavicon.trim()) {
            const selected = new URL(saved.tabCloakFavicon.trim(), location.href);
            if (selected.protocol === "https:" || selected.protocol === "http:") {
              href = selected.href;
            }
          }
        } catch {}
        const icon = document.createElement("link");
        icon.rel = "icon";
        icon.href = href;
        icon.onerror = () => { icon.onerror = null; icon.href = "/Kara.png"; };
        document.head.appendChild(icon);
        const shortcut = document.createElement("link");
        shortcut.rel = "shortcut icon";
        shortcut.href = href;
        shortcut.onerror = () => { shortcut.onerror = null; shortcut.href = "/Kara.png"; };
        document.head.appendChild(shortcut);
      })();
    </script>
    <link rel="apple-touch-icon" href="/Kara.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Kara's Proxy</title>
    <script src="%BASE_URL%scramjet/scramjet.js"></script>
    <script src="%BASE_URL%controller/controller.api.js"></script>
    <meta property="og:image" content="/Kara.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/Kara.png" />
  </head>
  <body>
    <div id="root"><main style="min-height:100vh;display:grid;place-items:center;background:#0a0306;color:#fff;font-family:system-ui,sans-serif;padding:24px;text-align:center"><div><strong style="font-size:24px">Kara</strong><p style="color:#a1a1aa">Starting Kara…</p></div></main></div>
    <script>
      (() => {
        const showError = (label, detail) => {
          const root = document.getElementById("root");
          if (!root) return;
          const panel = document.createElement("main");
          panel.style.cssText = "min-height:100vh;display:grid;place-items:center;background:#0a0306;color:#fff;font:14px system-ui,sans-serif;padding:24px";
          const card = document.createElement("section");
          card.style.cssText = "max-width:620px;width:100%;border:1px solid #7f1d1d;border-radius:16px;padding:24px;background:#14080a";
          const title = document.createElement("h1");
          title.textContent = "Kara could not start";
          title.style.cssText = "font-size:22px;margin:0 0 12px;color:#f87171";
          const message = document.createElement("pre");
          message.textContent = label + (detail ? "\\n" + detail : "");
          message.style.cssText = "white-space:pre-wrap;overflow-wrap:anywhere;color:#e4e4e7;font:12px ui-monospace,monospace";
          const hint = document.createElement("p");
          hint.textContent = "Send this error message so the startup issue can be fixed.";
          hint.style.cssText = "color:#a1a1aa;margin:16px 0 0";
          card.append(title, message, hint);
          panel.append(card);
          root.replaceChildren(panel);
        };
        window.addEventListener("error", event => {
          const target = event.target;
          if (target && target !== window && (target.src || target.href)) {
            // Optional images and favicon links must never prevent Kara from starting.
            // Browsers and school networks may block third-party branding assets.
            if (
              target instanceof HTMLImageElement ||
              (target instanceof HTMLLinkElement && /(^|\\s)(icon|shortcut)(\\s|$)/i.test(target.rel))
            ) return;
            showError("A page resource failed to load", target.src || target.href);
          } else {
            showError(event.message || "Unknown JavaScript error", event.filename ? event.filename + ":" + event.lineno + ":" + event.colno : "");
          }
        }, true);
        window.addEventListener("unhandledrejection", event => {
          const reason = event.reason;
          showError("Unhandled startup promise rejection", reason && (reason.stack || reason.message) || String(reason));
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
